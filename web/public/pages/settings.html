<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" href="../assets/css/home.css">
</head>
<body class="home-page">
    <header class="searchBar home-searchbar">
        <div class="dropdown menu-dropdown">
            <button class="buttonHome" id="menuToggleButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenuDropdown">Menu</button>
            <div id="settingsMenuDropdown" class="dropdown-content" role="menu">
                <button id="goHomeButton" type="button" role="menuitem">Accueil</button>
                <button id="goProfileButton" type="button" role="menuitem">Profil</button>
                <button id="goSettingsButton" type="button" role="menuitem">Settings</button>
                <button id="goWikiButton" type="button" role="menuitem">Wiki du jeu</button>
                <button id="goLoginButton" type="button" role="menuitem">Connexion</button>
            </div>
        </div>
        <div class="search-center">
            <input type="text" id="searchInput" placeholder="Rechercher un utilisateur">
            <button class="searchButton" id="searchButton" type="button">Rechercher</button>
        </div>
        <div class="search-spacer" aria-hidden="true"></div>
    </header>

    <section class="home-hero" aria-label="Banniere settings">
        <div class="hero-title-block">
            <span class="hero-subtitle">Parametres</span>
            <h1>Settings</h1>
            <p>Configure ton experience de jeu.</p>
        </div>
    </section>

    <main class="home-layout">
        <section class="container" style="width: 100%;">
            <h2>Settings</h2>

            <div class="setting-item">
                <input type="checkbox" id="inventoryPreview">
                <label for="inventoryPreview">Allow player to see your inventory</label>
            </div>

            <div class="setting-item">
                <input type="checkbox" id="notifications">
                <label for="notifications">Enable Dark Mode</label>
            </div>

            <button class="searchButton" id="saveSettings" type="button">Save Settings</button>
        </section>
    </main>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/home.js"></script>
    <script src="../assets/js/settings.js"></script>
</body>
</html>
