<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="../assets/css/profil.css?v=20260424-7">
</head>
<body class="home-page profile-page">

    <header class="searchBar home-searchbar">
        <div class="dropdown menu-dropdown">
            <button class="buttonHome" id="menuToggleButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="profileMenuDropdown">Menu</button>
            <div id="profileMenuDropdown" class="dropdown-content" role="menu">
                <button id="goHomeButton" type="button" role="menuitem">Accueil</button>
                <button id="goProfileButton" type="button" role="menuitem">Profil</button>
                <button id="goSettingsButton" type="button" role="menuitem">Settings</button>
                <button id="goWikiButton" type="button" role="menuitem">Wiki du jeu</button>
                <button id="goLoginButton" type="button" role="menuitem">Connexion</button>
            </div>
        </div>
        <div class="search-center">
            <input type="text" id="searchInput" placeholder="Enter a username">
            <div class="searchResults" id="searchResults"></div>
            <button class="searchButton" id="searchButton" type="button">Rechercher</button>
        </div>
        <div class="search-spacer" aria-hidden="true"></div>
    </header>
    
    
<main class="profile-main">
<div class="layout profile-layout">

    <!-- LEFT : EQUIPMENT + DETAILS -->
    <section class="equipment-panel" aria-label="Equipment panel">
        <h2>Equipment</h2>

        <div class="human-visual" aria-hidden="true">
            <div class="human-body"></div>

            <button class="human-slot human-slot-head" type="button" data-slot="head">
                <img id="slot-head" src="../assets/img/slots/head.png" alt="Head slot">
            </button>
            <button class="human-slot human-slot-chest" type="button" data-slot="chest">
                <img id="slot-chest" src="../assets/img/slots/chest.png" alt="Chest slot">
            </button>
            <button class="human-slot human-slot-pants" type="button" data-slot="pants">
                <img id="slot-pants" src="../assets/img/slots/pants.png" alt="Pants slot">
            </button>
            <button class="human-slot human-slot-boots" type="button" data-slot="boots">
                <img id="slot-boots" src="../assets/img/slots/boots.png" alt="Boots slot">
            </button>
            <button class="human-slot human-slot-weapon" type="button" data-slot="weapon">
                <img id="slot-weapon" src="../assets/img/slots/weapon.png" alt="Weapon slot">
            </button>
        </div>

        <div class="mobile-slot-list" aria-label="Equipment list">
            <button class="mobile-slot-item" type="button" data-slot="head"><span>Head</span><span id="mobile-slot-head">None</span></button>
            <button class="mobile-slot-item" type="button" data-slot="chest"><span>Chest</span><span id="mobile-slot-chest">None</span></button>
            <button class="mobile-slot-item" type="button" data-slot="pants"><span>Pants</span><span id="mobile-slot-pants">None</span></button>
            <button class="mobile-slot-item" type="button" data-slot="boots"><span>Boots</span><span id="mobile-slot-boots">None</span></button>
            <button class="mobile-slot-item" type="button" data-slot="weapon"><span>Weapon</span><span id="mobile-slot-weapon">None</span></button>
        </div>

        <div class="slot-infos" id="slotInfos">
            <h3>Equipment Infos</h3>
            <p id="info-name">Name : -</p>
            <p id="info-rarity">Rarity : -</p>
            <p id="info-level">Level : -</p>
            <p id="info-desc">Description : Select a slot to see details.</p>
        </div>
    </section>

    <!-- RIGHT : PROFILE + STATS + INVENTORY -->
    <div class="container">
        <h2>Profile</h2>

        <form id="profile">
            <div class="container-header">
                <span id="name">Pseudo : JohnDoe</span>
                <span id="level">Level : 12</span>
            </div>

            <section class="player-stats-card" aria-label="Player stats">
                <h3>Player Stats</h3>
                <div class="stats-grid">
                    <div class="stat-item"><span class="stat-label">Level</span><span class="stat-value" id="stat-level">-</span></div>
                    <div class="stat-item"><span class="stat-label">XP</span><span class="stat-value" id="stat-xp">-</span></div>
                    <div class="stat-item"><span class="stat-label">Gold</span><span class="stat-value" id="stat-gold">-</span></div>
                    <div class="stat-item"><span class="stat-label">Health</span><span class="stat-value" id="stat-health">-</span></div>
                    <div class="stat-item"><span class="stat-label">Mana</span><span class="stat-value" id="stat-mana">-</span></div>
                    <div class="stat-item"><span class="stat-label">Stamina</span><span class="stat-value" id="stat-stamina">-</span></div>
                    <div class="stat-item"><span class="stat-label">Strength</span><span class="stat-value" id="stat-strength">-</span></div>
                    <div class="stat-item"><span class="stat-label">Intelligence</span><span class="stat-value" id="stat-intelligence">-</span></div>
                </div>
            </section>

            <table id="inventories">
                <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Rarity</th>
                    <th>Level</th>
                    <th>Price</th>
                    <th>Equipment Type</th>
                    <th>Weapon Type</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </form>
    </div>

</div>
</main>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/profil.js"></script>
</body>
</html>
