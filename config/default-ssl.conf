<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    DirectoryIndex pages/login.html pages/home.html index.php index.html
    RedirectMatch 302 ^/$ /pages/login.html

    # Serve public/ pour le site HTML
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Alias pour le dossier php/ pour tes scripts backend Unreal Engine
    Alias /php /var/www/html/php
    <Directory /var/www/html/php>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/server.key

    # Indique aux apps PHP qu'elles sont derriere HTTPS.
    SetEnv HTTPS on

    ErrorLog ${APACHE_LOG_DIR}/error-ssl.log
    CustomLog ${APACHE_LOG_DIR}/access-ssl.log combined
</VirtualHost>
</IfModule>
